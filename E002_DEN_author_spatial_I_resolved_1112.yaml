# Frozen scientific recipe; effective batch8 = micro2 x accumulation4. Grouping JSON governs path mapping.
model:
  network:
    instance:
      _target_: models.networks.multiutae.MultiUTAE
      input_dim: 4
      num_classes: 6
      in_features: 512
      str_conv_k: 4
      str_conv_s: 2
      str_conv_p: 1
      agg_mode: att_group
      encoder_norm: group
      n_head: 16
      d_k: 4
      pad_value: 0
      padding_mode: reflect
      T: 1000
      offset: 10
  loss:
    instance:
      _target_: models.losses.Losses
      mix:
        focal: 1.0
      ignore_index: 6
  optimizer:
    optim:
      _target_: torch.optim.AdamW
      lr: 0.0001
      betas:
      - 0.9
      - 0.999
      weight_decay: 0.01
    exclude_ln_and_biases_from_weight_decay: false
  lr_scheduler:
    _partial_: true
    _target_: utils.lr_scheduler.WarmupLR
    warmup_steps: 5000
  name: multiUTAE
  val_metrics:
    _target_: metrics.scd_metrics.SCDMetric
    num_classes: 6
    class_names: &id001
    - impervi
    - agricult
    - forest
    - wetlands
    - soil
    - water
    ignore_index: 6
  test_metrics:
    _target_: metrics.scd_metrics.SCDMetric
    num_classes: 6
    class_names: *id001
    ignore_index: 6
computer:
  devices: 1
  num_workers: 4
  progress_bar_refresh_rate: 2
  sync_batchnorm: false
  accelerator: gpu
  precision: 16-mixed
  strategy: auto
  num_nodes: 1
